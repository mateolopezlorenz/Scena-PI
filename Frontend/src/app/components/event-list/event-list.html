<div class="event-list-container">

  <h1>{{ title }}</h1>

  <app-map-view [events]="events"></app-map-view>

  <event-filters *ngIf="showFilters" (filtersChanged)="onFiltersChanged($event)"></event-filters>

  <div *ngIf="isLoading" class="spinner-overlay">
    <div>
      <div class="spinner-scena"></div>
      <p style="color:#BE185D; font-size:0.9rem; margin-top:0.5rem">Cargando eventos...</p>
    </div>
  </div>

  <div class="row g-3 mt-2" *ngIf="!isLoading">
    <div *ngFor="let event of events" class="col-12 col-sm-6 col-lg-4">
      <div class="card-scena h-100 d-flex flex-column">

        <div class="event-card-header">
          <span class="badge-category badge-{{ event.category }}">{{ event.category }}</span>
        </div>

        <h3 class="event-card-title">{{ event.name }}</h3>

        <div class="event-card-info">
          <p><span class="info-icon">📅</span> {{ event.startDate | date:'dd MMM yyyy, HH:mm' }}</p>
          <p><span class="info-icon">📍</span> {{ event.local?.ubication || event.address }}</p>
          <p><span class="info-icon"></span> {{ event.status }} </p>
        </div>

        <div class="event-card-actions mt-auto">
          <button (click)="viewEvent(event.id)" class="btn-details">Ver detalles</button>
          <button *ngIf="isLoggedIn" (click)="toggleLike(event.id)" class="like-btn" [class.liked]="isLiked(event.id)">
            {{ isLiked(event.id) ? '&#9829;' : '&#9825;' }} {{ likeCounts[event.id] || 0 }}
          </button>
          <button *ngIf="!isLoggedIn" (click)="toggleLike(event.id)" class="like-btn">
            &#9829; +MG ({{ likeCounts[event.id] || 0 }})
          </button>
        </div>

      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && events.length === 0" class="card-scena text-center p-4 mt-3">
    <p style="margin:0">No hay eventos para mostrar.</p>
  </div>

</div>
